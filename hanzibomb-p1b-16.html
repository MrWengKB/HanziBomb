<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>汉字炸弹</title>
  <style>
    body {
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'PingFang SC', sans-serif;
      text-align: center;
      background-color: #87CEEB;
      margin: 0;
      padding: 20px;
      user-select: none;
    }

    h1 {
      color: #333;
      margin: 10px 0;
      font-size: 28px;
    }

    #ui-bar {
      background-color: white;
      padding: 15px;
      border-radius: 15px;
      display: inline-flex;
      gap: 20px;
      align-items: center;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      margin-bottom: 20px;
      font-size: 20px;
      font-weight: bold;
      flex-wrap: wrap;
      justify-content: center;
    }

    .stat-box {
      background-color: #f0f8ff;
      padding: 10px 20px;
      border-radius: 10px;
      border: 2px solid #ccc;
    }

    #lives { color: #d9534f; }
    #score { color: #5cb85c; }

    #speed-control {
      display: flex;
      align-items: center;
      gap: 10px;
      background-color: #f9f9f9;
      padding: 10px;
      border-radius: 10px;
      border: 2px solid #ddd;
    }

    .btn-action {
      padding: 10px 20px;
      font-size: 20px;
      border-radius: 10px;
      font-family: inherit;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
      border: none;
    }

    #quit-btn {
      background-color: #ff9800;
      color: white;
    }

    #quit-btn:hover {
      background-color: #e68a00;
    }

    #game-container {
      width: 800px;
      height: 500px;
      background-color: #fff;
      margin: 0 auto;
      position: relative;
      overflow: hidden;
      border: 6px solid #444;
      border-radius: 20px;
      background-image: linear-gradient(to bottom, #e0f7fa, #b2ebf2);
      box-shadow: inset 0 0 20px rgba(0,0,0,0.1);
    }

    #pinyin-display {
      position: absolute;
      top: 20px;
      width: 100%;
      text-align: center;
      font-size: 64px;
      font-weight: bold;
      color: #d32f2f;
      z-index: 10;
      text-shadow: 2px 2px 4px rgba(255, 255, 255, 0.8);
    }

    .bomb {
      width: 70px;
      height: 70px;
      background-color: #2c3e50;
      border-radius: 50%;
      position: absolute;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      cursor: pointer;
      box-shadow: 0 6px 10px rgba(0,0,0,0.4);
      transition: background-color 0.2s;
    }

    .bomb::before {
      content: '🔥';
      position: absolute;
      top: -25px;
      font-size: 24px;
    }

    .bomb:hover {
      transform: scale(1.05);
    }

    .explosion {
      background-color: transparent !important;
      box-shadow: none !important;
      font-size: 80px;
    }
    
    .explosion::before {
      display: none;
    }

    .overlay-screen {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .screen-title { 
      font-size: 50px; 
      margin: 0 0 15px 0; 
    }
    
    .start-btn {
      background-color: #2196F3;
      color: white;
      padding: 16px 45px;
      font-size: 28px;
      margin-top: 20px;
    }
    .start-btn:hover { background-color: #1976D2; }

    .play-again-btn {
      background-color: #4CAF50;
      color: white;
      padding: 15px 40px;
      font-size: 26px;
      margin-top: 20px;
    }
    .play-again-btn:hover { background-color: #45a049; }
  </style>
</head>
<body>

  <h1>汉字炸弹</h1>
  
  <div id="ui-bar">
    <div class="stat-box">生命: ❤️ <span id="lives">10</span></div>
    <div class="stat-box">得分: ⭐ <span id="score">0</span> / 20</div>
    <div id="speed-control">
      <label for="speed">速度:</label>
      <input type="range" id="speed" min="1" max="8" step="0.5" value="2.5">
    </div>
    <button id="quit-btn" class="btn-action" onclick="quitGame()">退出 ❌</button>
  </div>

  <div id="game-container">
    <div id="pinyin-display"></div>

    <!-- 开始界面 -->
    <div id="start-screen" class="overlay-screen">
      <h2 class="screen-title" style="color: #ffca28;">汉字炸弹 💣</h2>
      <p style="font-size: 22px; margin: 10px 0;">看拼音，点击正确的汉字炸弹将其消除！</p>
      <button class="btn-action start-btn" onclick="startGame()">开始游戏 🚀</button>
    </div>

    <!-- 结算界面 -->
    <div id="game-over" class="overlay-screen" style="display: none;">
      <h2 id="game-over-title" class="screen-title"></h2>
      <p style="font-size: 28px;">你的得分: <span id="final-score"></span></p>
      <button class="btn-action play-again-btn" onclick="startGame()">再玩一次 🎮</button>
    </div>
  </div>

  <script>
    // 新字表（含确认读音）
    const dictionary = [
      { char: '甜', pinyin: 'tián' },
      { char: '苦', pinyin: 'kǔ' },
      { char: '臭', pinyin: 'chòu' },
      { char: '生', pinyin: 'shēng' },
      { char: '重', pinyin: 'zhòng' },
      { char: '喝', pinyin: 'hē' },
      { char: '甘', pinyin: 'gān' },
      { char: '汁', pinyin: 'zhī' },
      { char: '买', pinyin: 'mǎi' },
      { char: '斤', pinyin: 'jīn' },
      { char: '串', pinyin: 'chuàn' },
      { char: '弯', pinyin: 'wān' },
      { char: '选', pinyin: 'xuǎn' },
      { char: '最', pinyin: 'zuì' },
      { char: '抱', pinyin: 'bào' },
      { char: '拿', pinyin: 'ná' },
      { char: '办', pinyin: 'bàn' },
      { char: '法', pinyin: 'fǎ' },
      { char: '圆', pinyin: 'yuán' },
      { char: '切', pinyin: 'qiē' },
      { char: '怎', pinyin: 'zěn' }
    ];

    let lives, score, gameActive = false, activeBombs = [], targetChar, animationFrameId;
    let questionPool = []; 
    let wrongStreak = 0;
    const WIN_SCORE = 20;
    
    const container = document.getElementById('game-container');
    const pinyinDisplay = document.getElementById('pinyin-display');
    const livesDisplay = document.getElementById('lives');
    const scoreDisplay = document.getElementById('score');
    const speedInput = document.getElementById('speed');
    const startScreen = document.getElementById('start-screen');
    const gameOverScreen = document.getElementById('game-over');
    const gameOverTitle = document.getElementById('game-over-title');
    const finalScoreDisplay = document.getElementById('final-score');

    // 洗牌机制：打乱题库，确保抽完一整轮前不重复
    function resetQuestionPool() {
      questionPool = [...dictionary].sort(() => Math.random() - 0.5);
    }

    function startGame() {
      lives = 10;
      score = 0;
      gameActive = true;
      activeBombs = [];
      wrongStreak = 0;
      resetQuestionPool();
      
      livesDisplay.innerText = lives;
      scoreDisplay.innerText = score;
      startScreen.style.display = 'none';
      gameOverScreen.style.display = 'none';
      
      document.querySelectorAll('.bomb').forEach(el => el.remove());
      
      spawnWave();
      if (animationFrameId) cancelAnimationFrame(animationFrameId);
      gameLoop();
    }

    function spawnWave() {
      activeBombs.forEach(b => b.element.remove());
      activeBombs = [];
      wrongStreak = 0;

      // 题库用完后重新洗牌循环
      if (questionPool.length === 0) {
        resetQuestionPool();
      }

      const targetObj = questionPool.pop();
      targetChar = targetObj.char;
      pinyinDisplay.innerText = targetObj.pinyin;

      let choices = [targetObj];
      let usedPinyins = new Set([targetObj.pinyin.toLowerCase()]);

      // 干扰项排除同音字，避免出现拼音歧义
      let candidateList = dictionary
        .filter(item => item.pinyin.toLowerCase() !== targetObj.pinyin.toLowerCase())
        .sort(() => Math.random() - 0.5);

      for (let cand of candidateList) {
        const candPinyin = cand.pinyin.toLowerCase();
        if (!usedPinyins.has(candPinyin)) {
          choices.push(cand);
          usedPinyins.add(candPinyin);
        }
        if (choices.length === 4) break;
      }

      choices.sort(() => Math.random() - 0.5);

      const columns = container.offsetWidth / 4;
      choices.forEach((choice, index) => {
        const bombEl = document.createElement('div');
        bombEl.className = 'bomb';
        bombEl.innerText = choice.char;
        
        const randomOffsetX = Math.random() * (columns - 80);
        const xPos = (index * columns) + randomOffsetX + 10;
        const yPos = -80 - (Math.random() * 100); 

        bombEl.style.left = xPos + 'px';
        bombEl.style.top = yPos + 'px';

        bombEl.onmousedown = () => handleBombClick(choice.char, bombEl);

        container.appendChild(bombEl);

        activeBombs.push({
          element: bombEl,
          char: choice.char,
          y: yPos,
          exploded: false
        });
      });
    }

    function handleBombClick(char, element) {
      if (!gameActive) return;

      if (char === targetChar) {
        wrongStreak = 0;
        score++;
        scoreDisplay.innerText = score;
        
        if (score >= WIN_SCORE) {
          endScreen('win');
        } else {
          spawnWave();
        }
      } else {
        wrongStreak++;
        element.style.backgroundColor = '#d9534f'; 
        setTimeout(() => { 
          if (element) element.style.backgroundColor = '#2c3e50'; 
        }, 200);

        // 连错两次直接扣血并重新出题
        if (wrongStreak >= 2) {
          activeBombs.forEach(b => explode(b));
          handleDamage();
        }
      }
    }

    function gameLoop() {
      if (!gameActive) return;

      const speed = parseFloat(speedInput.value);
      let targetReachedFloor = false;
      const floorLevel = container.offsetHeight - 70;

      activeBombs.forEach(bomb => {
        if (bomb.exploded) return;
        
        bomb.y += speed;
        bomb.element.style.top = bomb.y + 'px';

        if (bomb.y >= floorLevel) {
          if (bomb.char === targetChar) {
            targetReachedFloor = true;
            explode(bomb);
          } else {
            bomb.element.style.display = 'none';
          }
        }
      });

      if (targetReachedFloor) {
        handleDamage();
        return;
      }

      animationFrameId = requestAnimationFrame(gameLoop);
    }

    function explode(bomb) {
      bomb.exploded = true;
      bomb.element.className = 'bomb explosion';
      bomb.element.innerText = '💥';
    }

    function handleDamage() {
      lives--;
      livesDisplay.innerText = lives;
      gameActive = false;

      if (lives <= 0) {
        setTimeout(() => {
          endScreen('lose');
        }, 800);
      } else {
        setTimeout(() => {
          gameActive = true;
          spawnWave();
          gameLoop();
        }, 1200);
      }
    }

    function quitGame() {
      if (!gameActive) return;
      endScreen('quit');
    }

    function endScreen(status) {
      gameActive = false;
      if (animationFrameId) cancelAnimationFrame(animationFrameId);

      if (status === 'win') {
        gameOverTitle.innerText = "胜利! 🎉";
        gameOverTitle.style.color = "#4CAF50";
      } else if (status === 'lose') {
        gameOverTitle.innerText = "失败! 💥";
        gameOverTitle.style.color = "#ffeb3b";
      } else if (status === 'quit') {
        gameOverTitle.innerText = "下次再来! 👋";
        gameOverTitle.style.color = "#ffffff";
      }

      finalScoreDisplay.innerText = score + " / " + WIN_SCORE;
      gameOverScreen.style.display = 'flex';
    }
  </script>
</body>
</html>
