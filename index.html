<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>汉字炸弹 💣</title>
  <style>
    body {
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      text-align: center;
      background-color: #87CEEB;
      margin: 0;
      padding: 20px;
      user-select: none;
    }

    h1 {
      color: #333;
      margin: 10px 0;
      font-size: 28px;
    }

    #ui-bar {
      background-color: white;
      padding: 10px 15px;
      border-radius: 15px;
      display: inline-flex;
      gap: 10px;
      align-items: center;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      margin-bottom: 15px;
      font-size: 18px;
      font-weight: bold;
      flex-wrap: nowrap;
      justify-content: center;
    }

    .stat-box {
      background-color: #f0f8ff;
      padding: 8px 16px;
      border-radius: 10px;
      border: 2px solid #ccc;
    }

    #lives { color: #d9534f; }
    #score { color: #5cb85c; }

    .control-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background-color: #f9f9f9;
      padding: 8px 12px;
      border-radius: 10px;
      border: 2px solid #ddd;
    }

    select {
      font-family: inherit;
      font-size: 16px;
      font-weight: bold;
      padding: 5px 10px;
      border-radius: 8px;
      border: 1.5px solid #aaa;
      background-color: #fff;
      cursor: pointer;
      outline: none;
    }

    select:focus {
      border-color: #2196F3;
    }

    .btn-action {
      padding: 8px 18px;
      font-size: 18px;
      border-radius: 10px;
      font-family: inherit;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
      border: none;
      transition: transform 0.1s, background-color 0.2s;
    }

    .btn-action:hover {
      transform: translateY(-2px);
    }

    #quit-btn {
      background-color: #ff9800;
      color: white;
    }

    #quit-btn:hover {
      background-color: #e68a00;
    }

    #game-container {
      width: 800px;
      height: 500px;
      background-color: #fff;
      margin: 0 auto;
      position: relative;
      overflow: hidden;
      border: 6px solid #444;
      border-radius: 20px;
      background-image: linear-gradient(to bottom, #e0f7fa, #b2ebf2);
      box-shadow: inset 0 0 20px rgba(0,0,0,0.1);
    }

    #pinyin-display {
      position: absolute;
      top: 20px;
      width: 100%;
      text-align: center;
      font-size: 64px;
      font-weight: bold;
      color: #d32f2f;
      z-index: 10;
      text-shadow: 2px 2px 4px rgba(255, 255, 255, 0.8);
    }

    .bomb {
      width: 70px;
      height: 70px;
      background-color: #2c3e50;
      border-radius: 50%;
      position: absolute;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      cursor: pointer;
      box-shadow: 0 6px 10px rgba(0,0,0,0.4);
      transition: background-color 0.2s, transform 0.1s;
    }

    .bomb::before {
      content: '🔥';
      position: absolute;
      top: -25px;
      font-size: 24px;
    }

    .bomb:hover {
      transform: scale(1.08);
    }

    .explosion {
      background-color: transparent !important;
      box-shadow: none !important;
      font-size: 80px;
    }
    
    .explosion::before {
      display: none;
    }

    .overlay-screen {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .screen-title { 
      font-size: 46px; 
      margin: 0 0 10px 0; 
    }
    
    .start-btn {
      background-color: #2196F3;
      color: white;
      padding: 14px 45px;
      font-size: 26px;
      margin-top: 15px;
    }
    .start-btn:hover { background-color: #1976D2; }

    .play-again-btn {
      background-color: #4CAF50;
      color: white;
      padding: 14px 40px;
      font-size: 24px;
      margin-top: 15px;
    }
    .play-again-btn:hover { background-color: #45a049; }

    .lesson-badge {
      font-size: 18px;
      color: #b2ebf2;
      margin-top: 5px;
    }
  </style>
</head>
<body>
  
  <div id="ui-bar">
    <div class="control-box">
      <label for="lesson-select">课次:</label>
      <select id="lesson-select" onchange="changeLesson()">
        <!-- options populated by JS -->
      </select>
    </div>
    <div class="stat-box">❤️ <span id="lives">10</span></div>
    <div class="stat-box">⭐ <span id="score">0</span> / <span id="target-score">20</span></div>
    <div class="control-box">
      <label for="speed">速度:</label>
      <input type="range" id="speed" min="1" max="8" step="0.5" value="2.5">
    </div>
    <button id="quit-btn" class="btn-action" onclick="quitGame()">退出 ❌</button>
  </div>

  <div id="game-container">
    <div id="pinyin-display"></div>

    <!-- 开始界面 -->
    <div id="start-screen" class="overlay-screen">
      <h2 class="screen-title" style="color: #ffca28;">汉字炸弹 💣</h2>
      <p style="font-size: 22px; margin: 8px 0;">看拼音，点击正确的汉字炸弹将其消除！</p>
      <div style="margin: 10px 0; font-size: 20px;">
        当前课次：<span id="start-lesson-name" style="color: #81d4fa; font-weight: bold;">全部课次</span>
        <span id="start-word-count" class="lesson-badge"></span>
      </div>
      <button class="btn-action start-btn" onclick="startGame()">开始游戏 🚀</button>
    </div>

    <!-- 结算界面 -->
    <div id="game-over" class="overlay-screen" style="display: none;">
      <h2 id="game-over-title" class="screen-title"></h2>
      <p style="font-size: 28px; margin: 10px 0;">你的得分: <span id="final-score"></span></p>
      <button class="btn-action play-again-btn" onclick="startGame()">再玩一次 🎮</button>
    </div>
  </div>

    const lessonSelect = document.getElementById('lesson-select');
    const startLessonName = document.getElementById('start-lesson-name');
    const startWordCount = document.getElementById('start-word-count');
    const targetScoreDisplay = document.getElementById('target-score');

    // 初始化课次下拉菜单
    function initLessonOptions() {
      // 全部课次选项
      const allOpt = document.createElement('option');
      allOpt.value = 'ALL';
      allOpt.innerText = '全部课次';
      lessonSelect.appendChild(allOpt);

      // 各课次选项
      for (let lesson in ALL_LESSONS) {
        const opt = document.createElement('option');
        opt.value = lesson;
        opt.innerText = lesson;
        lessonSelect.appendChild(opt);
      }
      updateStartScreenInfo();
    }

    function updateStartScreenInfo() {
      const selected = lessonSelect.value;
      if (selected === 'ALL') {
        let totalCount = 0;
        Object.keys(ALL_LESSONS).forEach(k => totalCount += ALL_LESSONS[k].length);
        startLessonName.innerText = "全部课次";
        startWordCount.innerText = `（共 ${totalCount} 字）`;
      } else {
        startLessonName.innerText = selected;
        startWordCount.innerText = `（共 ${ALL_LESSONS[selected].length} 字）`;
      }
    }

    function changeLesson() {
      updateStartScreenInfo();
      // 如果游戏正在进行中，退出到结算/开始重新启动
      if (gameActive) {
        quitGame();
      }
    }

    // 获取当前选中的字表
    function getCurrentDictionary() {
      const val = lessonSelect.value;
      if (val === 'ALL') {
        let fullList = [];
        for (let k in ALL_LESSONS) {
          fullList = fullList.concat(ALL_LESSONS[k]);
        }
        return fullList;
      }
      return ALL_LESSONS[val] || [];
    }

    // 全局完整词库（用于生成干扰项）
    let GLOBAL_DICTIONARY = [];
    for (let k in ALL_LESSONS) {
      GLOBAL_DICTIONARY = GLOBAL_DICTIONARY.concat(ALL_LESSONS[k]);
    }

    let lives, score, gameActive = false, activeBombs = [], targetChar, animationFrameId;
    let questionPool = []; 
    let wrongStreak = 0;
    let currentDictionary = [];
    const WIN_SCORE = 20;
    
    const container = document.getElementById('game-container');
    const pinyinDisplay = document.getElementById('pinyin-display');
    const livesDisplay = document.getElementById('lives');
    const scoreDisplay = document.getElementById('score');
    const speedInput = document.getElementById('speed');
    const startScreen = document.getElementById('start-screen');
    const gameOverScreen = document.getElementById('game-over');
    const gameOverTitle = document.getElementById('game-over-title');
    const finalScoreDisplay = document.getElementById('final-score');

    // 洗牌机制：打乱题库，确保抽完一整轮前不重复
    function resetQuestionPool() {
      questionPool = [...currentDictionary].sort(() => Math.random() - 0.5);
    }

    function startGame() {
      currentDictionary = getCurrentDictionary();
      if (!currentDictionary || currentDictionary.length === 0) return;

      lives = 10;
      score = 0;
      gameActive = true;
      activeBombs = [];
      wrongStreak = 0;
      resetQuestionPool();
      
      livesDisplay.innerText = lives;
      scoreDisplay.innerText = score;
      targetScoreDisplay.innerText = WIN_SCORE;
      startScreen.style.display = 'none';
      gameOverScreen.style.display = 'none';
      
      document.querySelectorAll('.bomb').forEach(el => el.remove());
      
      spawnWave();
      if (animationFrameId) cancelAnimationFrame(animationFrameId);
      gameLoop();
    }

    function spawnWave() {
      activeBombs.forEach(b => b.element.remove());
      activeBombs = [];
      wrongStreak = 0;

      // 题库用完后重新洗牌循环
      if (questionPool.length === 0) {
        resetQuestionPool();
      }

      const targetObj = questionPool.pop();
      targetChar = targetObj.char;
      pinyinDisplay.innerText = targetObj.pinyin;

      let choices = [targetObj];
      let usedPinyins = new Set([targetObj.pinyin.toLowerCase()]);
      let usedChars = new Set([targetObj.char]);

      // 干扰项机制：优先从当前课次选择不同拼音的生字
      let candidateList = currentDictionary
        .filter(item => item.pinyin.toLowerCase() !== targetObj.pinyin.toLowerCase() && !usedChars.has(item.char))
        .sort(() => Math.random() - 0.5);

      for (let cand of candidateList) {
        const candPinyin = cand.pinyin.toLowerCase();
        if (!usedPinyins.has(candPinyin)) {
          choices.push(cand);
          usedPinyins.add(candPinyin);
          usedChars.add(cand.char);
        }
        if (choices.length === 4) break;
      }

      // 如果当前课次字数少于4个互不重读音的字，从全局字表补充干扰项
      if (choices.length < 4) {
        let globalCandidates = GLOBAL_DICTIONARY
          .filter(item => !usedPinyins.has(item.pinyin.toLowerCase()) && !usedChars.has(item.char))
          .sort(() => Math.random() - 0.5);
        for (let cand of globalCandidates) {
          const candPinyin = cand.pinyin.toLowerCase();
          if (!usedPinyins.has(candPinyin)) {
            choices.push(cand);
            usedPinyins.add(candPinyin);
            usedChars.add(cand.char);
          }
          if (choices.length === 4) break;
        }
      }

      choices.sort(() => Math.random() - 0.5);

      const columns = container.offsetWidth / choices.length;
      choices.forEach((choice, index) => {
        const bombEl = document.createElement('div');
        bombEl.className = 'bomb';
        bombEl.innerText = choice.char;
        
        const randomOffsetX = Math.random() * (columns - 80);
        const xPos = (index * columns) + Math.max(10, randomOffsetX);
        const yPos = -80 - (Math.random() * 80); 

        bombEl.style.left = xPos + 'px';
        bombEl.style.top = yPos + 'px';

        bombEl.onmousedown = () => handleBombClick(choice.char, bombEl);

        container.appendChild(bombEl);

        activeBombs.push({
          element: bombEl,
          char: choice.char,
          y: yPos,
          exploded: false
        });
      });
    }

    function handleBombClick(char, element) {
      if (!gameActive) return;

      if (char === targetChar) {
        wrongStreak = 0;
        score++;
        scoreDisplay.innerText = score;
        
        if (score >= WIN_SCORE) {
          endScreen('win');
        } else {
          spawnWave();
        }
      } else {
        wrongStreak++;
        element.style.backgroundColor = '#d9534f'; 
        setTimeout(() => { 
          if (element) element.style.backgroundColor = '#2c3e50'; 
        }, 200);

        // 连错两次直接扣血并重新出题
        if (wrongStreak >= 2) {
          activeBombs.forEach(b => explode(b));
          handleDamage();
        }
      }
    }

    function gameLoop() {
      if (!gameActive) return;

      const speed = parseFloat(speedInput.value);
      let targetReachedFloor = false;
      const floorLevel = container.offsetHeight - 70;

      activeBombs.forEach(bomb => {
        if (bomb.exploded) return;
        
        bomb.y += speed;
        bomb.element.style.top = bomb.y + 'px';

        if (bomb.y >= floorLevel) {
          if (bomb.char === targetChar) {
            targetReachedFloor = true;
            explode(bomb);
          } else {
            bomb.element.style.display = 'none';
          }
        }
      });

      if (targetReachedFloor) {
        handleDamage();
        return;
      }

      animationFrameId = requestAnimationFrame(gameLoop);
    }

    function explode(bomb) {
      bomb.exploded = true;
      bomb.element.className = 'bomb explosion';
      bomb.element.innerText = '💥';
    }

    function handleDamage() {
      lives--;
      livesDisplay.innerText = lives;
      gameActive = false;

      if (lives <= 0) {
        setTimeout(() => {
          endScreen('lose');
        }, 800);
      } else {
        setTimeout(() => {
          gameActive = true;
          spawnWave();
          gameLoop();
        }, 1200);
      }
    }

    function quitGame() {
      if (!gameActive) return;
      endScreen('quit');
    }

    function endScreen(status) {
      gameActive = false;
      if (animationFrameId) cancelAnimationFrame(animationFrameId);

      if (status === 'win') {
        gameOverTitle.innerText = "胜利! 🎉";
        gameOverTitle.style.color = "#4CAF50";
      } else if (status === 'lose') {
        gameOverTitle.innerText = "失败! 💥";
        gameOverTitle.style.color = "#ffeb3b";
      } else if (status === 'quit') {
        gameOverTitle.innerText = "下次再来! 👋";
        gameOverTitle.style.color = "#ffffff";
      }

      finalScoreDisplay.innerText = score + " / " + WIN_SCORE;
      gameOverScreen.style.display = 'flex';
    }

    // 初始化
    initLessonOptions();
  </script>
</body>
</html>
